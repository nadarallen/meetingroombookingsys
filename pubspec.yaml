name: meeting_room_booking
description: A Meeting Room Booking System Flutter app using Clean Architecture and MVVM with Provider.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^16.2.4
  http: ^1.2.2
  shared_preferences: ^2.3.1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.1
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3
  firebase_messaging: ^16.0.3
  file_picker: ^8.1.3
  image: ^4.1.7
  google_maps_flutter: ^2.7.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  flutter_local_notifications: ^19.4.2
  intl: ^0.20.2
  fl_chart: ^0.68.0
  flutter_polyline_points: ^2.0.0
  flutter_tts: ^4.0.2
  geolocator: ^13.0.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
